name: Battle Stat Regression Checks

on:
  push:
    branches: [dev]
    paths:
      - 'src/components/scene/**'
      - 'src/components/room/**'
      - 'src/lib/image-upload.ts'
      - 'tests/image-upload.mjs'
      - 'src/components/dice/**'
      - 'src/lib/dice/**'
      - 'tests/dice-results.mjs'
      - 'tests/dice-banner.mjs'
      - 'src/components/toast.tsx'
      - 'src/lib/database.types.ts'
      - 'supabase/migrations/**'
      - 'tests/battle-stats.db.mjs'
      - 'tests/token-groups.db.mjs'
      - 'tests/combat-visuals.mjs'
      - 'src/lib/scene/combatVisuals.ts'
      - 'package*.json'
      - '.github/workflows/test-battle-stats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint -- src/components/scene/SceneCanvas.tsx src/components/scene/TokenBattleStats.tsx src/components/room/ImageUploadButton.tsx src/lib/image-upload.ts src/lib/dice/rollBanner.ts src/components/toast.tsx src/components/dice/DiceTray.tsx
      - name: Isolated Postgres regression
        run: npm run test:battle-stats
      - name: Token-group RLS and deployment regression
        run: npm run test:token-groups
      - name: Combat visual regression
        run: npm run test:combat-visuals
      - name: Dice engine and parser regressions
        run: npm run test:dice-results
      - name: Natural and dirty dice banner regressions
        run: node --test tests/dice-banner.mjs
      - name: Image upload and drag-drop regressions
        run: npm run test:image-upload
